  <style>

    body { margin: 0; }
    a { color: #01579b; } a:hover { color: #013f70; }
    .a { font-family: 'Anek Latin', system-ui, sans-serif; }
    .sys { font-family: system-ui, "Anek Latin", "Noto Sans", sans-serif; }
    .num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

    /* .fld was used four times and never defined, so every field on this card
       rendered as an icon on one line and the value under it, with no height.
       A field is a row: icon, value, and whatever sits at the end. 56px clears
       the 44px target floor with room for a focus ring outside the box. */
    .fld {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 0 14px;
      background: #fff;
      box-sizing: border-box;
    }
    .fld > svg { flex-shrink: 0; }
    .lift2 { box-shadow: 0 2px 4px rgba(28,26,23,.10), 0 16px 44px rgba(28,26,23,.16); }

    /* The same springs the motion board runs. One staged entrance, nothing
       loops, and the button answers the finger rather than the click.

       320ms, not the 746ms the landing hero uses: this is a sign-in card,
       which is UI, and the budget for a panel arriving is 200-500ms. A
       marketing hero is allowed to take its time; a form is not. */
    :root {
      --e-smooth: linear(0,0.0234,0.0805,0.1562,0.2403,0.326,0.409,0.4867,0.5576,0.6213,0.6777,0.727,0.7697,0.8065,0.838,0.8647,0.8874,0.9065,0.9225,0.9359,0.9471,0.9564,0.9641,0.9705,0.9758,0.9802,0.9838,0.9867,0.9892,0.9911,0.9928,0.9941,0.9952,0.9961,0.9968,0.9974,0.9979,0.9983,0.9986,0.9989,1);
      --e-press:  linear(0,0.0239,0.082,0.1588,0.244,0.3306,0.4142,0.4923,0.5634,0.6271,0.6833,0.7324,0.7748,0.8112,0.8423,0.8687,0.8909,0.9096,0.9253,0.9383,0.9492,0.9582,0.9657,0.9719,0.977,0.9812,0.9846,0.9875,0.9898,0.9917,0.9932,0.9945,0.9955,0.9964,0.9971,0.9976,0.9981,0.9984,0.9987,0.999,1);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    .a1 { animation: rise 320ms var(--e-smooth) both; }
    .a2 { animation: rise 320ms var(--e-smooth) 70ms both; }
    .a3 { animation: rise 320ms var(--e-smooth) 140ms both; }
    /* Press feedback was 378ms, the settle time of the press spring. The budget
       for a button press is 100-160ms: at 378ms the tap feels sluggish because
       the finger is already gone. And it was symmetric, which is wrong twice
       over. The press snaps, the release eases back. */
    .tap { transition: transform 260ms var(--e-press); }
    .tap:active { transform: scale(.97); transition-duration: 120ms; }
    @media (prefers-reduced-motion: reduce) {
      .a1,.a2,.a3 { animation: none; }
      .tap { transition: none; }
    }

    /* GLASS — desktop sign-in card only.
       It floats over a real field photograph, indoors, on a laptop. The card's
       CHROME is translucent; every input and every piece of text sits on an
       opaque fill inside it, because contrast over an arbitrary backdrop cannot
       be certified. */
    /* GLASS — one recipe, used on three surfaces, all of them desktop and all of
       them over the frame grid so there is genuine per-cell variation to sample.
       A translucent panel over a FLAT fill is a no-op blur and a pointless panel,
       which is what this looked like before the grid went in.

       Nothing on glass carries a money figure, a verification claim or body copy.
       Labels get their own shadow so legibility never depends on the backdrop. */
    .glass {
      background: rgba(246,243,239,.13);
      backdrop-filter: blur(18px) saturate(125%);
      -webkit-backdrop-filter: blur(18px) saturate(125%);
      box-shadow: inset 0 1px 0 rgba(246,243,239,.22);
    }
    @supports not (backdrop-filter: blur(1px)) { .glass { background: rgba(29,26,23,.86); } }
    @media (prefers-reduced-transparency: reduce) {
      .glass { background: rgba(29,26,23,.90); backdrop-filter: none; -webkit-backdrop-filter: none; }
    }
    .ots { text-shadow: 0 1px 5px rgba(0,0,0,.55); }
  </style>
</head>
