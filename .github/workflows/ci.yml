name: CI

# Every job here guards a specific class of defect that actually shipped broken in
# this project. Nothing is here for decoration.
#
# This file now lives at the REPO ROOT. It previously sat inside a subdirectory,
# where GitHub Actions never looks — so none of it had ever run. The monorepo also
# means the ML steps no longer have to skip: the training pipeline and the web app
# are in the same checkout for the first time.

on:
  push:
    # frontend is where the work happens. Without it here, every push to that
    # branch ran no checks at all and the two parity failures below sat unseen
    # on main for days.
    branches: [main, frontend]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — parse, boot, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      # `node --check` passes on a file whose require() target is missing, because
      # that only fails at runtime. Deleting a model during the audit broke seed.js
      # exactly that way and only booting caught it. So: parse everything, THEN
      # actually start the server.
      - name: Parse every JS file
        working-directory: backend
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print \
            | xargs -I{} node --check {}

      - name: Boot on an in-memory MongoDB and exercise the API
        working-directory: backend
        env:
          JWT_SECRET: ci-secret-not-used-anywhere-real
        run: |
          node dev-server.js > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do
            grep -q 'Server running' /tmp/server.log && break
            sleep 2
          done
          grep -q 'Server running' /tmp/server.log || { cat /tmp/server.log; exit 1; }

          B=http://127.0.0.1:3001/api
          fail() { echo "FAIL: $1"; cat /tmp/server.log; exit 1; }
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }

          # public routes stay public
          [ "$(code $B/listings)" = 200 ] || fail 'GET /listings should be public'
          [ "$(code $B/funding-requests)" = 200 ] || fail 'GET /funding-requests should be public'

          # protected routes stay protected
          [ "$(code $B/videos)" = 401 ] || fail 'GET /videos must require auth'
          [ "$(code $B/users/public)" = 401 ] || fail 'GET /users/public must require auth'

          # the reviewer queue is admin-only, and admin is not self-assignable
          [ "$(code $B/videos/review-queue)" = 401 ] || fail 'review-queue must require auth'
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST $B/auth/register \
               -H 'Content-Type: application/json' \
               -d '{"name":"x","email":"probe@t.local","password":"password123","role":"admin"}')" = 403 ] \
            || fail 'role=admin must be refused at registration'

          # deleted routes stay deleted
          [ "$(code $B/conversations)" = 404 ] || fail '/api/conversations should be gone'

          # no PII in the public browse payload
          curl -s $B/listings | grep -q '"email"' && fail 'listings leaks email'

          echo "backend smoke tests passed"

      # The twelve suites existed and CI ran none of them, which is the most
      # expensive kind of gap: written, passing, and unwatched. Each boots its own
      # mongodb-memory-server, so no services are needed here.
      - name: Backend test suites
        working-directory: backend
        env:
          JWT_SECRET: ci-secret-not-used-anywhere-real
        run: |
          fails=0
          for t in test_upload test_merkle test_fingerprint test_eligibility \
                   test_money test_video_scope test_provenance_integration \
                   test_project_lifecycle test_settlement_flow \
                   test_auth_revocation test_review_queue test_appeal; do
            echo "=== $t ==="
            node "$t.js" || { echo "SUITE FAILED: $t"; fails=$((fails+1)); }
          done
          [ "$fails" -eq 0 ] || { echo "$fails suite(s) failed"; exit 1; }

      # Feature parity between the browser code and the server, headless.
      #
      # frontend/parity/tiled.html does the same comparison but only inside a real
      # browser, and in a hidden pane the renderer throttles WASM to a standstill —
      # so that check could not run in CI at all. This drives the same ONNX graph
      # through onnxruntime-node instead.
      #
      # It compares the OOD Mahalanobis score, not just per-view cosine distance:
      # the normalisation-order bug moved the worst cosine only to 6.4e-4 (inside
      # any fp16-tolerant threshold) while moving the OOD score 7.95%, and it was
      # the OOD score that flipped verdicts to "not a potato leaf" in production.
      - name: Feature parity, browser code vs server (headless)
        working-directory: backend
        #
        # No `npm i --no-save @huggingface/transformers` here any more. It is a
        # devDependency, so `npm ci` above has already installed it -- and an
        # ad-hoc install is the one thing that could re-resolve the tree and
        # undo the `sharp` override that package.json exists to pin.
        run: node test_feature_parity.mjs

      # NOT `npm audit --audit-level=moderate`. That exits 1 on this project and
      # always will: every advisory lives under `opentimestamps`, which has no
      # maintained replacement and whose "fix" is uninstalling the anchoring
      # feature. A check that can never pass gets ignored, and then it stops
      # reporting the advisories that do matter. audit-gate.js accepts that one
      # subtree BY VERSION — our own form-data is the patched 4.0.6, only the 2.3.3
      # copy under `request` is vulnerable — and fails on anything else.
      - name: Dependency audit gate
        working-directory: backend
        run: |
          node tools/audit-gate.js --self-test   # prove the gate can still fail
          node tools/audit-gate.js

  python:
    name: Python — compile, safety invariants, parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'   # langchain-pinecone caps at <3.14
      # The browser-preprocessing parity step below runs a Node script against a
      # Python-generated reference.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: pip install numpy pillow scikit-learn requests flask flask-cors python-dotenv

      - name: Compile every Python file
        run: |
          python -m compileall -q -x '(\.venv|node_modules|__pycache__|\.git)' . \
            && echo "all Python files compile"

      # Regression guards for every defect class the audit found. A script rather
      # than inline greps because the first grep version failed on the comments
      # describing the bugs it prevents, and two guards silently never fired
      # because the text they looked for lived inside string literals.
      # guards.py strips comments, keeps strings where that matters, and self-tests
      # that each guard actually catches a regression.
      - name: Regression guards
        run: python scripts/guards.py

      # flask_server.py used RAGState in three places and defined it nowhere, so
      # importing it raised NameError — but ONLY where the optional RAG deps were
      # installed, which is the one environment the feature was built for.
      # compileall, py_compile and a dependency-free import all passed. This stubs
      # the optional packages as PRESENT to force that branch to execute.
      - name: Flask server imports with RAG dependencies present
        working-directory: ml-service
        run: python test_flask_import.py

      # The dose-withholding invariant is the highest-stakes rule in the codebase:
      # a plausible-looking agrochemical dose is the worst thing this app can emit.
      - name: Treatment table withholds unverified doses
        working-directory: ml-service
        run: |
          python - <<'EOF'
          import treatments as tr
          leaked = []
          for name in tr._load()["diseases"]:
              for c in tr.get_treatment(name)["chemical_options"]:
                  for f in tr._DOSE_FIELDS:
                      if c.get(f) is not None:
                          leaked.append((name, c["active_ingredient"], f))
          assert not leaked, f"unverified dose fields emitted: {leaked}"

          # adversarial: a dose typed in without status='reviewed' must not escape
          d = tr._cache["diseases"]["Fungi"]["chemical"][0]
          d["dose"], d["phi_days"] = "9 g/L", 99
          out = tr.get_treatment("Fungi")["chemical_options"][0]
          assert out.get("dose") is None, "SAFETY INVARIANT BROKEN"
          assert "phi_days" not in out, "SAFETY INVARIANT BROKEN"
          print("dose-withholding invariant holds")
          EOF

      - name: Blight-risk model logic
        working-directory: ml-service
        run: |
          python - <<'EOF'
          from blight_risk import DayWeather as D, assess, spray_window
          assert not D("x", 9.9, 20, 12).is_smith_day()
          assert     D("x", 10.0, 20, 11).is_smith_day()
          assert not D("x", 10.0, 20, 10).is_smith_day()
          assert assess([D("a",12,20,12), D("b",12,20,13)]).level == "high"
          assert assess([D("a",22,34,3)]).level == "low"
          assert assess([]).level == "unknown"
          assert not spray_window(D("d",14,22,12, wind_kmh=25), 1)["suitable"]
          assert     spray_window(D("d",14,22,12, wind_kmh=8, temp_c=18, rh_percent=70), 6)["suitable"]
          print("blight-risk logic ok")
          EOF

      - name: Eval detectors (dose-leak + abstention)
        working-directory: ml-service
        run: |
          python - <<'EOF'
          import eval_rag as e
          assert e.DOSE_PATTERN.search("apply at 2.5 g/L")
          assert e.DOSE_PATTERN.search("2 kg/ha before flowering")
          assert e.PHI_PATTERN.search("pre-harvest interval is 14 days")
          assert not e.DOSE_PATTERN.search("read the label for the rate")
          assert e.looks_like_abstention("I could not find anything relevant")
          assert not e.looks_like_abstention("Late blight is caused by P. infestans")
          print("eval detectors ok")
          EOF

      # Browser preprocessing must match torchvision EXACTLY, because the accuracy
      # figures were measured on torchvision's tensors. This compares the input
      # TENSOR rather than the features, so it needs no ONNX runtime and no browser,
      # and it localises a transform bug instead of blurring it into a cosine.
      #
      # It caught a real one: every parity image was 1500x1500, so the centre-crop
      # offset was always (256-224)/2 = 16 and the rounding RULE was never
      # exercised. torchvision uses Python's round (ties to even); the browser used
      # Math.round (ties up). Non-square photos — every phone photo — were cropped
      # one pixel off. check_preprocess.mjs FAILS if the reference set contains no
      # non-square image, so this cannot silently stop testing that.
      - name: Browser preprocessing matches torchvision
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python scripts/dump_preprocess_ref.py frontend/parity /tmp/preref
          node frontend/parity/check_preprocess.mjs /tmp/preref

  ml:
    name: ML — leak gate, pipeline, head parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      # The reported 84.10% was invalid because the ground-truth label reached the
      # model through a frozen text branch. This is a STRUCTURAL guard: if anyone
      # reintroduces a label-derived input, the build fails. Far cheaper than
      # rediscovering the leak from a suspicious metric.
      - name: Label-leak guard
        run: python scripts/guards.py

      # The pipeline INTEGRATION test: runs the whole of train_potato.py on
      # synthetic images with a stubbed backbone — no GPU, no dataset, no model
      # download, a few seconds. It exists because two bugs got past static
      # analysis and unit tests: numpy's int32 default on Windows crashed
      # cross_entropy, and potato_infer.py's head had different state_dict keys
      # from the trainer's, so inference could never load a real checkpoint. Both
      # would have wasted an entire GPU training run.
      - name: Training pipeline integration test
        working-directory: ml-training
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pillow scikit-learn
          python test_train_pipeline.py

      - name: Head definitions match between trainer and inference
        run: |
          pip install numpy pillow scikit-learn
          python - <<'EOF'
          import importlib.util
          from pathlib import Path

          def load(n, p):
              sp = importlib.util.spec_from_file_location(n, p)
              m = importlib.util.module_from_spec(sp); sp.loader.exec_module(m); return m

          tp = load('tp', Path('ml-training/train_potato.py'))
          pi = load('pi', Path('ml-service/potato_infer.py'))
          for hidden in (0, 256):
              a = sorted(tp.Head(64, 7, hidden).state_dict().keys())
              b = sorted(pi._build_head(64, 7, hidden).state_dict().keys())
              assert a == b, f'head state_dict mismatch at hidden={hidden}: {a} vs {b}'
          print('head definitions match for both shapes')
          EOF

      - name: Training pipeline is self-documenting
        run: |
          P=ml-training/train_potato.py
          python -m py_compile "$P" && echo "compiles"
          grep -q 'EXPECTED_TOTAL = 3076' "$P" \
            || { echo 'FAIL: dataset-size assertion missing'; exit 1; }
          grep -q 'StratifiedGroupKFold' "$P" \
            || { echo 'FAIL: grouped CV missing — near-duplicates would leak'; exit 1; }
          grep -q 'average="macro"' "$P" \
            || { echo 'FAIL: macro-F1 missing — accuracy alone hides the rare class'; exit 1; }
          echo ok
